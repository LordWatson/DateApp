name: ci

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      # Also generates the Wayfinder route helpers the lint and type checks import.
      - name: Build Assets
        run: npm run build

      # Every step below is a check, not a fixer: a style, lint or type error fails the run.
      - name: PHP Code Style
        run: composer lint:check

      - name: Frontend Lint
        run: npm run lint:check

      - name: Frontend Formatting
        run: npm run format:check

      - name: Frontend Types
        run: npm run types:check

      - name: PHP Static Analysis
        run: composer types:check

      - name: Tests
        run: php artisan test

      # Uses the runner's installed Chrome and its own throwaway database.
      - name: Browser Tests
        run: npm run test:e2e
        env:
          CI: true
